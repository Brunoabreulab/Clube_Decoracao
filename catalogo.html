<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clube Decoração | Quadros & Arte</title>
  <link rel="stylesheet" href="style.css">

  <!-- HEADER COM LOGO -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo-container">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 20,90 L 20,50 L 50,30 L 50,90 Z" stroke="#344e41" stroke-width="7" fill="none" stroke-linejoin="round"/>
          <path d="M 50,90 L 50,20 L 90,5 L 90,90 Z" stroke="#137772" stroke-width="7" fill="none" stroke-linejoin="round"/>
        </svg>
        <div class="logo-text">Clube <span>Decoração</span></div>
      </a>
      <button class="cart-btn" id="open-cart">
        Carrinho <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Transforme seus ambientes</h1>
    <p>Quadros exclusivos com curadoria de arte moderna e minimalista.</p>
  </section>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-container">
    <div class="filters">
      <button class="filter-btn active" onclick="filterCategory('todos')">Todos</button>
      <button class="filter-btn" onclick="filterCategory('abstrato')">Abstrato</button>
      <button class="filter-btn" onclick="filterCategory('minimalista')">Minimalista</button>
      <button class="filter-btn" onclick="filterCategory('design')">Design & Bauhaus</button>
    </div>

    <div class="products-grid" id="products-grid">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </main>

  <!-- MODAL DO CARRINHO -->
  <div class="overlay" id="overlay" onclick="closeAllModals()"></div>
  <div class="cart-modal" id="cart-modal">
    <div class="cart-header">
      <h2>Seu Carrinho</h2>
      <button class="close-cart" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <!-- Itens do carrinho -->
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">R$ 0,00</span>
      </div>
      <button class="checkout-btn" onclick="goToCheckout()">Finalizar Compra</button>
    </div>
  </div>

  <!-- TELA DE CHECKOUT -->
  <div class="checkout-modal" id="checkout-modal">
    <div class="cart-header">
      <h2>Dados do Pedido</h2>
      <button class="close-cart" onclick="closeCheckout()">&times;</button>
    </div>
    <form class="checkout-form" id="checkout-form" onsubmit="handleFinalCheckout(event)">
      <div class="form-group">
        <label for="full-name">Nome Completo</label>
        <input type="text" id="full-name" required placeholder="Digite seu nome completo" />
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" maxlength="14" required placeholder="000.000.000-00" oninput="formatCPF(this)" />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" />
      </div>

      <!-- NOVO CAMPO DE CEP -->
      <div class="form-group">
        <label for="cep">CEP</label>
        <input type="text" id="cep" maxlength="9" required placeholder="00000-000" oninput="formatCEP(this)" onblur="searchCEP()" />
        <span id="cep-message" class="cep-message"></span>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label for="city">Cidade</label>
          <input type="text" id="city" required placeholder="Sua cidade" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="state">Estado (UF)</label>
          <input type="text" id="state" maxlength="2" required placeholder="SP" style="text-transform: uppercase;" />
        </div>
      </div>

      <div class="form-group">
        <label for="number">Número</label>
        <input type="text" id="number" required placeholder="Nº da residência" />
      </div>

      <div class="qr-container">
        <p>Pagamento via PIX (Escaneie o QR Code abaixo):</p>
        <img src="imagens/WhatsApp Image 2026-06-05 at 12.01.20.jpeg" alt="QR Code de Pagamento" class="qr-image" />
      </div>

      <button type="submit" class="checkout-btn">Confirmar e Finalizar Compra</button>
    </form>
  </div>

  <!-- JAVASCRIPT INTERATIVO -->
  <script src="script.js"></script>
</body>
</html>
